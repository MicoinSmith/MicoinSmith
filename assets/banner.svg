<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" fill="none" role="img" aria-label="srilanka - Frontend 10y, AI Apps, Agent Tooling">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a1b27"/>
      <stop offset="0.55" stop-color="#16161e"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#70a5fd"/>
      <stop offset="0.5" stop-color="#bb9af7"/>
      <stop offset="1" stop-color="#2ac3de"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c0caf5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.25" r="0.75">
      <stop offset="0" stop-color="#bb9af7" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#bb9af7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2a2e45" stroke-width="1" stroke-opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>

  <!-- top accent bar -->
  <rect x="0" y="0" width="1280" height="4" fill="url(#accent)"/>

  <!-- left accent block -->
  <rect x="80" y="92" width="6" height="136" rx="3" fill="url(#accent)"/>

  <!-- terminal dots -->
  <circle cx="86" cy="66" r="6" fill="#ff5f56"/>
  <circle cx="106" cy="66" r="6" fill="#ffbd2e"/>
  <circle cx="126" cy="66" r="6" fill="#27c93f"/>

  <!-- name -->
  <text x="118" y="170" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="86" font-weight="800" fill="url(#textGrad)" letter-spacing="1">srilanka</text>
  <text x="122" y="206" font-family="'SF Mono',Consolas,'Courier New',monospace" font-size="21" fill="#70a5fd" letter-spacing="0.5">@MicoinSmith</text>

  <!-- tagline EN -->
  <text x="122" y="252" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="23" fill="#a9b1d6" letter-spacing="0.4">Frontend 10y  ·  AI Apps  ·  Agent Tooling</text>
  <!-- tagline CN -->
  <text x="122" y="284" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="21" fill="#7f88a8" letter-spacing="1">十年前端  ·  现在做 AI 应用与 Agent 工具</text>

  <!-- right monogram -->
  <g transform="translate(1040,160)">
    <circle r="104" fill="none" stroke="url(#accent)" stroke-width="3" stroke-opacity="0.9"/>
    <circle r="86" fill="none" stroke="#2ac3de" stroke-width="1" stroke-opacity="0.45"/>
    <text x="0" y="30" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="96" font-weight="800" fill="url(#accent)">S</text>
  </g>

  <!-- corner ticks -->
  <path d="M1180 40h60v60" fill="none" stroke="#2ac3de" stroke-width="2" stroke-opacity="0.5"/>
  <path d="M1240 280h-60v-60" fill="none" stroke="#2ac3de" stroke-width="2" stroke-opacity="0.5"/>
</svg>
